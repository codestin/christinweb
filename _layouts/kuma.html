<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.seo_title | default: page.title | escape }} · Kuma</title>
<meta name="description" content="{{ page.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.seo_title | default: page.title | escape }} · Kuma"><meta property="og:description" content="{{ page.description | escape }}"><meta property="og:type" content="website"><meta property="og:url" content="{{ page.url | absolute_url }}"><meta property="og:image" content="{{ '/assets/kuma/social-preview-v3.jpg' | absolute_url }}">
<meta property="og:site_name" content="Kuma">
<meta property="og:locale" content="en_US">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Kuma resting on a golden cushion beside the words A quiet companion for meditation">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.seo_title | default: page.title | escape }} · Kuma">
<meta name="twitter:description" content="{{ page.description | escape }}">
<meta name="twitter:image" content="{{ '/assets/kuma/social-preview-v3.jpg' | absolute_url }}">
<meta name="twitter:image:alt" content="Kuma resting on a golden cushion beside the words A quiet companion for meditation">
{% if page.url == '/kuma/' %}
<meta name="robots" content="index, follow, max-image-preview:large">
<script type="application/ld+json">{% include kuma-schema.json %}</script>
{% else %}
<meta name="robots" content="noindex, follow">
{% endif %}
<meta name="theme-color" content="#f8f4e9">
<link rel="stylesheet" href="/assets/kuma/kuma.css?v=watch-paper-2">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav wrap"><a class="brand" href="/kuma/" aria-label="Kuma home">Kuma<span class="brand-dot" aria-hidden="true"></span></a><nav aria-label="Kuma"><a href="/kuma/#practice">The practice</a><a href="/kuma/#widgets">Widgets</a><a href="/kuma/#apple-health">Watch &amp; Health</a><a href="/kuma/#questions">Questions</a><a class="button small" href="/kuma/#beta">Join the beta list <span aria-hidden="true">↗</span></a></nav></header>
<main id="main">{{ content }}</main>
<footer class="wrap footer"><div><a class="brand" href="/kuma/">Kuma<span class="brand-dot" aria-hidden="true"></span></a><p>A quiet companion. Made with care by <a href="/">Christin Chong</a>.</p></div><nav aria-label="Footer"><a href="/kuma/privacy/">Privacy</a><a href="/kuma/support/">Support</a><a href="mailto:hi@christinchong.com">Say hello</a></nav><small>© {{ 'now' | date: '%Y' }} Chong Consulting LLC</small></footer>
</body></html>
