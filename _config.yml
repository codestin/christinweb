title: Christin Chong, PhD
description: Buddhist chaplain, builder, and biotech marketer. Writing, coaching, and creative projects that make room for reflection and practice.
social_image: /assets/social/christin-chong-v5.jpg
social_image_width: 1200
social_image_height: 630
social_image_type: image/jpeg
social_image_alt: "Christin Chong beside her portrait. Neuroscience PhD. Buddhist Chaplain. Builder. Biotech Marketer."
include:             ['_pages']
exclude:             ['_includes/notes_graph.json', 'netlify', 'tests', 'docs', 'output']
# You may need to change the base URL depending on your deploy configuration.
baseurl:             ''

# Canonical URL for SEO (used for sitemap, meta tags, etc.)
url:                 'https://christinchong.com'

# Prevent future-dated posts from being published
# This filters out posts with dates in the future
future:              false

# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension:  false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

# Set to `true` to replace tweet URLs with Twitter embeds.
# Note that doing so will negatively the reader's privacy
# as their browser will communicate with Twitter's servers.
embed_tweets: false

permalink:           pretty
relative_permalinks: false

plugins:
  - jekyll-last-modified-at

sass:
  sass_dir:          _sass
  style:            :compressed

collections:
  notes:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
