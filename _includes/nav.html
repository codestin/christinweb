<div class="running-head">
  <a class="site-title" href="{{ site.baseurl }}/">Christin Chong<span class="site-credential">, PhD</span><span class="brand-dot" aria-hidden="true"></span></a>
  <nav class="nav-links desktop-navigation" aria-label="Main">{% include nav-items.html %}</nav>
  <details class="mobile-navigation">
    <summary>Menu</summary>
    <nav class="nav-links" aria-label="Main mobile">{% include nav-items.html %}</nav>
  </details>
</div>
<script>
  document.querySelector('.site-header').addEventListener('keydown', function (event) {
    if (event.key !== 'Escape') return;
    const disclosure = event.target.closest('details[open]');
    if (disclosure) {
      disclosure.open = false;
      disclosure.querySelector('summary').focus();
      event.preventDefault();
    }
  });
  document.addEventListener('click', function (event) {
    document.querySelectorAll('.desktop-navigation details[open]').forEach(function (menu) {
      if (!menu.contains(event.target)) menu.open = false;
    });
  });
</script>
