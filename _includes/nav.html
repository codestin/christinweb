<div class="running-head">
  <a class="internal-link site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>

  <nav class="nav-links" aria-label="Main">
    {% for item in site.data.navigation.main %}
      {% if item.children %}
        <div class="nav-item has-dropdown">
          <a class="internal-link nav-link" href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a>
          <div class="dropdown-menu">
            {% for child in item.children %}
              {% if child.url contains "://" %}
              <a class="dropdown-item" href="{{ child.url }}" target="_blank" rel="noopener noreferrer">{{ child.title }}</a>
              {% else %}
              <a class="internal-link dropdown-item" href="{{ site.baseurl }}{{ child.url }}">{{ child.title }}</a>
              {% endif %}
            {% endfor %}
          </div>
        </div>
      {% else %}
        <a class="internal-link nav-link" href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a>
      {% endif %}
    {% endfor %}
  </nav>
</div>
<div class="double-rule" role="presentation"></div>
