<div class="shortcuts-overlay"></div>

<div class="shortcuts-help">
  <h3>Keyboard Shortcuts</h3>

  <div class="shortcut-list">
    <kbd>d</kbd>
    <span>Toggle dark/light mode</span>

    <kbd>/</kbd>
    <span>Open search</span>

    <kbd>⌘</kbd> + <kbd>K</kbd>
    <span>Open command palette</span>

    <kbd>f</kbd>
    <span>Toggle focus mode</span>

    <kbd>g</kbd> then <kbd>h</kbd>
    <span>Go to home</span>

    <kbd>g</kbd> then <kbd>n</kbd>
    <span>Go to writing</span>

    <kbd>g</kbd> then <kbd>g</kbd>
    <span>Go to graph</span>

    <kbd>g</kbd> then <kbd>a</kbd>
    <span>Go to about</span>

    <kbd>?</kbd>
    <span>Show this help</span>

    <kbd>Esc</kbd>
    <span>Close overlays</span>
  </div>

  <p style="margin-top: 1.5em; font-size: 0.9em; color: var(--color-text-tertiary);">
    Press <kbd>Esc</kbd> or click outside to close
  </p>
</div>
