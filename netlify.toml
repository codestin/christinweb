[build]
  command = "jekyll build --trace && npx pagefind --site _site"
  publish = "_site"

# Legacy URLs.
#
# force = true matters here. Without it Netlify serves a real file at the path
# and never applies the rule, so old pages under _pages/unlinked kept shadowing
# these redirects and showing superseded copy. Specific rules must stay above
# the wildcards; Netlify uses the first match.

# Writing -> Notes
[[redirects]]
  from = "/writing"
  to = "/notes"
  status = 301
  force = true

[[redirects]]
  from = "/writing/*"
  to = "/notes"
  status = 301
  force = true

# Legacy URLs from the Super.so site (SEO preservation)
[[redirects]]
  from = "/book"
  to = "/projects/debug-your-meditation"
  status = 301
  force = true

[[redirects]]
  from = "/offerings/book"
  to = "/projects/debug-your-meditation"
  status = 301
  force = true

[[redirects]]
  from = "/offerings/coaching"
  to = "/hire/coaching"
  status = 301
  force = true

[[redirects]]
  from = "/offerings/*"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/offerings"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/courses"
  to = "/projects"
  status = 301
  force = true

[[redirects]]
  from = "/coaching"
  to = "/hire/coaching"
  status = 301
  force = true

[[redirects]]
